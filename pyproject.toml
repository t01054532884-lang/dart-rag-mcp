[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-rag-mcp"
version = "0.1.0"
description = "OpenDART 공시·재무 데이터를 벡터 검색과 도구 호출로 묻고 답하는 MCP 서버·에이전트"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "qdrant-client>=1.12",
  "fastembed>=0.5",
  "numpy>=1.26",
  "mcp>=2.0",
  "finance-datareader>=0.9.90",
]

[project.optional-dependencies]
agent = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
dart-rag-ingest = "dart_rag.ingest:main"
dart-rag-mcp = "dart_rag.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
